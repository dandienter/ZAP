version: "3.9"

# CATATAN: Semua password/secret WAJIB diisi lewat file .env atau environment
# host (sintaks ${VAR:?pesan} membuat `docker compose up` gagal bila kosong).
# Tidak ada kredensial bawaan di file ini.
# Data platform zapcore saat ini disimpan di SQLite (lihat
# docs/DEPLOYMENT_GUIDE.md); service postgres di bawah bersifat opsional
# untuk kebutuhan masa depan dan TIDAK diekspos ke jaringan host.

services:
  # -------------------------------------------------------------
  # 1. ZAP Backend (FastAPI + SymPy CFL Engine)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zap-backend
    restart: unless-stopped
    ports:
      # Hanya dapat dijangkau dari host lokal (reverse proxy), bukan publik.
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - ZAP_DB_PATH=/app/data/zap_platform.db
      - ZAP_JWT_SECRET=${ZAP_JWT_SECRET:?ZAP_JWT_SECRET wajib diisi di .env}
      - ZAP_MASTER_KEY=${ZAP_MASTER_KEY:-}
      - ZAP_GOOGLE_CLIENT_ID=${ZAP_GOOGLE_CLIENT_ID:?ZAP_GOOGLE_CLIENT_ID wajib diisi di .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data

  # -------------------------------------------------------------
  # 2. ZAP Frontend (Next.js 14 App Router)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://api.chatzap.web.id}
    container_name: zap-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://api.chatzap.web.id}
      # Rahasia server untuk route admin & verifikasi token Google di /api/user/sync
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET wajib diisi di .env}
      - ZAP_GOOGLE_CLIENT_ID=${ZAP_GOOGLE_CLIENT_ID:?ZAP_GOOGLE_CLIENT_ID wajib diisi di .env}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend/.zap_vault:/app/.zap_vault
    depends_on:
      - backend

  # -------------------------------------------------------------
  # 3. PostgreSQL Database (OPSIONAL - belum dipakai kode saat ini)
  #    Tidak ada port yang diterbitkan ke host: hanya dapat dijangkau
  #    dari jaringan internal compose.
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: zap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zap_production}
      POSTGRES_USER: ${POSTGRES_USER:-zap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
